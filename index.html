<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>썰 타이머</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 1.5rem;
    }

    .timer-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
    }

    .circle-timer {
      width: min(75vw, 320px);
      height: min(75vw, 320px);
      position: relative;
    }

    .circle-timer svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .circle-bg {
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 10;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* 안쪽 파이 조각 채우기 */
    .sector-fill {
      fill: #111827;
      opacity: 0.08; /* 너무 진하지 않게 */
    }

    .circle-progress {
      fill: none;
      stroke: #111827;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 0 9999;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .hand {
      stroke: #111827;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .inner-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .label {
      font-size: 1.2rem;
      font-weight: 700;
      white-space: pre-line;
    }

    .sub-label {
      margin-top: 0.2rem;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .seconds {
      margin-top: 0.6rem;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .controls button {
      flex: 1 1 30%;
      min-width: 90px;
      padding: 0.55rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #111827;
      background: #ffffff;
      color: #111827;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls button:disabled {
      opacity: 0.35;
      cursor: default;
    }

      background: #111827;
      color: #ffffff;
